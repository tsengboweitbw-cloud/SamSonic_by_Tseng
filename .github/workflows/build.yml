name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # The driver's plain C++ (the byte ring), on the runner's own compiler, with the sanitisers.
  native-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitize: ["address,undefined", thread]
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S app/src/test/cpp -B build/native-tests -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSAMSONIC_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build/native-tests
      - name: Test
        run: ctest --test-dir build/native-tests --output-on-failure

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew :app:lintDebug
      # R8 runs only here, so this is what catches a missing keep rule.
      - name: Release build
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: app/build/reports
